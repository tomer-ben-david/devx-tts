[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
childlogdir=/var/log/supervisor

[program:fastapi]
command=uvicorn api.src.main:app --host 0.0.0.0 --port 8880
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:restart-server]
command=python3 /app/restart_server.py
autostart=true
autorestart=false  ; Don't restart if it exits (especially exit(0) for restart)
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",RESTART_SERVER_PORT="8881"
stopasgroup=true
killasgroup=true
